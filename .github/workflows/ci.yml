name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    container:
      # Match @playwright/test in package.json; includes browsers, fonts and OS libraries.
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
      options: --ipc=host
    defaults:
      run:
        # Embedded PostgreSQL requires a named, non-root operating-system user.
        shell: runuser -u pwuser --preserve-environment -- bash --noprofile --norc -e -o pipefail {0}
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.22.1"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: "11.25.0"
          run_install: false
      - name: Prepare writable test workspace
        shell: bash
        run: chown -R pwuser:pwuser "$GITHUB_WORKSPACE" "$HOME"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate database client
        run: pnpm db:generate
      - name: Check formatting
        run: |
          pnpm format:check
          pnpm exec prettier --check ".github/workflows/*.yml"
      - name: Check types
        run: pnpm typecheck
      - name: Unity build-tool regressions (no Editor required)
        run: pnpm unity:test:tools
      - name: Unit and database integration tests
        run: pnpm test
      - name: Build extension
        run: pnpm build:extension
      # Default browser tests use simulated login and translation fixtures only.
      - name: Capture and library browser tests
        run: pnpm exec playwright test
      - name: Popup browser tests
        run: pnpm exec playwright test --config playwright.popup.config.ts
      - name: Build website
        run: pnpm build:web
      - name: Save browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
