name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.22.1"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: "11.25.0"
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate database client
        run: pnpm db:generate
      - name: Check formatting
        run: |
          pnpm format:check
          pnpm exec prettier --check ".github/workflows/*.yml"
      - name: Check types
        run: pnpm typecheck
      - name: Unity build-tool regressions (no Editor required)
        run: pnpm unity:test:tools
      - name: Unit and database integration tests
        run: pnpm test
      - name: Build extension
        run: pnpm build:extension
      - name: Install Chromium and Linux dependencies
        timeout-minutes: 5
        run: |
          # Retry transient mirror errors without consuming the whole job timeout.
          sudo tee /etc/apt/apt.conf.d/80-ci-network >/dev/null <<'APT'
          Acquire::Retries "2";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          APT
          # Keep the runner's Azure mirror; use HTTPS without redirecting to another host.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://azure.archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          pnpm exec playwright install --with-deps chromium
      # Default browser tests use simulated login and translation fixtures only.
      - name: Capture and library browser tests
        run: pnpm exec playwright test
      - name: Popup browser tests
        run: pnpm exec playwright test --config playwright.popup.config.ts
      - name: Build website
        run: pnpm build:web
      - name: Save browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
